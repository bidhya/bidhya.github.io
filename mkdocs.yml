site_name: Bidhyananda Yadav | Portfolio
site_url: https://bidhya.github.io/
site_author: Bidhyananda Yadav
site_description: Portfolio site showcasing expertise in Spatial Data Science, Remote Sensing, and Machine Learning.

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep-purple
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode (slate)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep-purple
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select

plugins:
  - search
  # Controlled tag vocabulary. The build FAILS on any tag not listed here,
  # so the taxonomy is enforced rather than merely documented.
  # Three tiers: domain (mirrors the site's topic vocabulary), technique, tool.
  # Adding a tag is a deliberate decision - see SITE_REFACTOR_PLAN.md.
  - tags:
      tags_allowed:
        # -- Domain (mirrors nav sections and blog categories) --
        - AI & Machine Learning
        - Geospatial & Remote Sensing
        - HPC & Infrastructure
        - Practice & Tooling
        # -- Technique --
        - Deep Learning
        - Computer Vision
        - NLP
        - LLM
        - Transformers
        - Embeddings
        - Fine-Tuning
        - Foundation Models
        - Distributed Computing
        - Inference
        - Model Evaluation
        - State Estimation
        - Remote Sensing
        - Coordinate Systems
        - Data Engineering
        - Visualization
        # -- Tool --
        - PyTorch
        - CUDA
        - Dask
        - SLURM
        - Xarray
        - Rasterio
        - GeoPandas
        - Claude Code
  # One entry per URL moved during the structure refactor. Keep these permanently:
  # removing one silently breaks any link already shared.
  - redirects:
      redirect_maps:
        notes/ai-ml/multi-node-parallelization.md: notes/hpc/multi-node-parallelization.md
        notes/ai-ml/on-prem-ai-assistant.md: notes/hpc/on-prem-ai-assistant.md
        notes/ai-ml/vllm-hpc-setup.md: notes/hpc/vllm-hpc-setup.md
        notes/ai-ml/linux-shell-setup.md: notes/hpc/linux-shell-setup.md
        notes/ai-ml/geospatial-peft.md: notes/geospatial/geospatial-peft.md
  - mkdocs-jupyter:
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - def_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: "&copy; 2026 Bidhyananda Yadav"

extra:
  analytics:
    provider: google
    property: G-7X7ET1CZZR
  social:
